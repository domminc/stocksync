# Traefik(Docker provider)이 80/443 을 쓰고 있는 서버용 배포 파일.
# 같은 폴더의 .env 에 값을 넣고 실행한다 (.env 는 저장소에 올리지 않는다).
#   STOCKSYNC_DOMAIN=jejubaseball.com        (필수)
#   TRAEFIK_CERT_RESOLVER=letsencrypt        (Traefik 에 설정된 인증서 resolver 이름)
#   PASSWORD_MIN_LENGTH=10                   (선택, 6~64)
#   ADMIN_USERNAME=jiny / ADMIN_PASSWORD=... (첫 실행 때만 필요. 계정이 만들어지면 ADMIN_PASSWORD 줄을 지운다)
# 실행: docker compose -f deploy/docker-compose.traefik.yml --project-directory . up -d --build
services:
  stocksync:
    build: ..
    container_name: stocksync
    restart: unless-stopped
    environment:
      PASSWORD_MIN_LENGTH: ${PASSWORD_MIN_LENGTH:-10}
      ADMIN_USERNAME: ${ADMIN_USERNAME:-jiny}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-}
    volumes:
      - stocksync_data:/data
    ports:
      - "127.0.0.1:3000:3000"
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.stocksync.rule=Host(`${STOCKSYNC_DOMAIN:?STOCKSYNC_DOMAIN 을 .env 에 지정하세요}`)"
      - "traefik.http.routers.stocksync.entrypoints=websecure"
      - "traefik.http.routers.stocksync.tls=true"
      - "traefik.http.routers.stocksync.tls.certresolver=${TRAEFIK_CERT_RESOLVER:-letsencrypt}"
      - "traefik.http.services.stocksync.loadbalancer.server.port=3000"

volumes:
  stocksync_data:
